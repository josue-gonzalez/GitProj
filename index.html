<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3eadb" />
    <title>A Cool Welcome</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact</a>
        <a href="album.html">Album</a>
      </nav>
      <div class="sun-mark" aria-hidden="true"></div>
      <h1 id="greeting" aria-live="polite">Hello</h1>
      <time id="local-time"></time>
    </main>

    <script>
      const greeting = document.querySelector("#greeting");
      const clock = document.querySelector("#local-time");
      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
      });

      function updateGreeting() {
        const now = new Date();
        const hour = now.getHours();

        if (hour < 6) greeting.textContent = "Good night";
        else if (hour < 12) greeting.textContent = "Good morning";
        else if (hour < 18) greeting.textContent = "Good afternoon";
        else greeting.textContent = "Good evening";

        clock.dateTime = now.toISOString();
        clock.textContent = timeFormatter.format(now);
      }

      updateGreeting();
      window.setInterval(updateGreeting, 1000);
    </script>
  </body>
</html>
