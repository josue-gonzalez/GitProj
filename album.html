<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Album Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 24px;
        background: #f4f1ec;
        color: #242321;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
      }
      header {
        margin-bottom: 28px;
      }
      .label {
        margin: 0 0 8px;
        color: #8b6950;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.4rem);
        letter-spacing: -0.04em;
      }
      .intro {
        margin: 10px 0 0;
        color: #716d67;
      }
      .album-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
        gap: 20px;
      }
      .album {
        overflow: hidden;
        border-radius: 14px;
        background: white;
        box-shadow: 0 5px 20px #31271912;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .album:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 28px #31271920;
      }
      .album img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }
      .details {
        padding: 16px 18px 18px;
      }
      .details h2 {
        margin: 0 0 5px;
        font-size: 1.1rem;
      }
      .details p {
        margin: 0;
        color: #817c75;
        font-size: 0.9rem;
      }
      @media (max-width: 520px) {
        body {
          padding: 32px 16px;
        }
        .album-grid {
          gap: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="label">Collected moments</p>
        <h1>Photo albums</h1>
        <p class="intro">Places, people, and things worth remembering.</p>
      </header>
      <section class="album-grid" aria-label="Photo albums">
        <article class="album">
          <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85"
            alt="Mountain lake reflecting the surrounding peaks"
          />
          <div class="details">
            <h2>Mountain escapes</h2>
            <p>12 photos · Summer 2024</p>
          </div>
        </article>
        <article class="album">
          <img
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=85"
            alt="City lights glowing at dusk"
          />
          <div class="details">
            <h2>City after dark</h2>
            <p>18 photos · Autumn 2024</p>
          </div>
        </article>
        <article class="album">
          <img
            src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=85"
            alt="Ocean waves rolling toward a quiet beach"
          />
          <div class="details">
            <h2>Coastal days</h2>
            <p>9 photos · Spring 2024</p>
          </div>
        </article>
        <article class="album">
          <img
            src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85"
            alt="Golden sunlight over a field at sunrise"
          />
          <div class="details">
            <h2>Golden mornings</h2>
            <p>14 photos · Winter 2024</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
