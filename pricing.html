<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3eadb" />
    <title>Pricing | A Cool Welcome</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="pricing-page">
    <main>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="pricing.html" aria-current="page">Pricing</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="sun-mark" aria-hidden="true"></div>
      <h1>Pricing</h1>
      <p class="page-copy">Sample plans for a warmer welcome.</p>
      <div class="pricing-table-wrap">
        <table class="pricing-table">
          <thead>
            <tr>
              <th scope="col">Plan</th>
              <th scope="col">
                Starter
                <span class="price">Free</span>
              </th>
              <th scope="col">
                Personal
                <span class="price">$5 / month</span>
              </th>
              <th scope="col">
                Studio
                <span class="price">$12 / month</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Welcome pages</th>
              <td>1</td>
              <td>3</td>
              <td>10</td>
            </tr>
            <tr>
              <th scope="row">Color themes</th>
              <td>Basic</td>
              <td>All themes</td>
              <td>All themes</td>
            </tr>
            <tr>
              <th scope="row">Custom styling</th>
              <td>No</td>
              <td>Yes</td>
              <td>Yes</td>
            </tr>
            <tr>
              <th scope="row">Email support</th>
              <td>No</td>
              <td>Yes</td>
              <td>Priority</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
